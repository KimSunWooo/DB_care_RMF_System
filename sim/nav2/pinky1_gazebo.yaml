# Gazebo-only Nav2 parameters for /pinky1.
# Frames match the live TF tree: pinky1/odom -> pinky1/base_footprint.
# cmd_vel stays geometry_msgs/Twist. This file is not the fleet graph.
pinky1:
  map_server:
    ros__parameters:
      use_sim_time: true
      yaml_filename: ""
  amcl:
    ros__parameters:
      use_sim_time: true
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: pinky1/base_footprint
      odom_frame_id: pinky1/odom
      global_frame_id: map
      scan_topic: scan
      robot_model_type: nav2_amcl::DifferentialMotionModel
      tf_broadcast: true
      transform_tolerance: 1.0
      laser_model_type: likelihood_field
      laser_likelihood_max_dist: 2.0
      laser_max_range: 8.0
      laser_min_range: 0.12
      max_beams: 60
      max_particles: 2000
      min_particles: 500
      pf_err: 0.05
      pf_z: 0.99
      recovery_alpha_fast: 0.0
      recovery_alpha_slow: 0.0
      resample_interval: 1
      sigma_hit: 0.2
      update_min_a: 0.05
      update_min_d: 0.05
      z_hit: 0.5
      z_max: 0.05
      z_rand: 0.5
      z_short: 0.05
      set_initial_pose: true
      initial_pose.x: 0.0
      initial_pose.y: 0.0
      initial_pose.z: 0.0
      initial_pose.yaw: 0.0
  bt_navigator:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: pinky1/base_footprint
      odom_topic: odom
      bt_loop_duration: 10
      default_server_timeout: 60
      wait_for_service_timeout: 1000
      action_server_result_timeout: 180.0
      enable_stamped_cmd_vel: false
      navigators: ["navigate_to_pose", "navigate_through_poses"]
      navigate_to_pose:
        plugin: nav2_bt_navigator::NavigateToPoseNavigator
      navigate_through_poses:
        plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      error_code_names:
        - compute_path_error_code
        - follow_path_error_code
  controller_server:
    ros__parameters:
      use_sim_time: true
      controller_frequency: 10.0
      costmap_update_timeout: 1.0
      odom_topic: odom
      enable_stamped_cmd_vel: false
      publish_zero_velocity: true
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.5
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.1
        movement_time_allowance: 30.0
      general_goal_checker:
        stateful: true
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.2
        yaw_goal_tolerance: 0.4
      FollowPath:
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        desired_linear_vel: 0.12
        max_linear_accel: 0.2
        max_angular_accel: 0.6
        allow_reversing: false
        lookahead_dist: 0.35
        use_velocity_scaled_lookahead_dist: true
        lookahead_time: 1.2
        min_lookahead_dist: 0.2
        max_lookahead_dist: 0.6
        use_rotate_to_heading: true
        rotate_to_heading_min_angle: 0.4
        rotate_to_heading_angular_vel: 0.5
        use_regulated_linear_velocity_scaling: false
        use_cost_regulated_linear_velocity_scaling: true
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        approach_velocity_scaling_dist: 0.4
        min_approach_linear_velocity: 0.04
        transform_tolerance: 0.5
  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: pinky1/odom
        robot_base_frame: pinky1/base_footprint
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.15
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: scan
          scan:
            topic: /pinky1/scan
            data_type: LaserScan
            clearing: true
            marking: true
            obstacle_max_range: 3.0
            raytrace_max_range: 3.5
            obstacle_min_range: 0.12
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          inflation_radius: 0.25
          cost_scaling_factor: 3.0
        always_send_full_costmap: true
  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: pinky1/base_footprint
        robot_radius: 0.15
        resolution: 0.05
        track_unknown_space: false
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: scan
          scan:
            topic: /pinky1/scan
            data_type: LaserScan
            clearing: true
            marking: true
            obstacle_max_range: 3.5
            raytrace_max_range: 4.0
            obstacle_min_range: 0.12
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          inflation_radius: 0.3
          cost_scaling_factor: 3.0
        always_send_full_costmap: true
  planner_server:
    ros__parameters:
      use_sim_time: true
      expected_planner_frequency: 5.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: nav2_navfn_planner::NavfnPlanner
        tolerance: 0.3
        use_astar: false
        allow_unknown: false
  behavior_server:
    ros__parameters:
      use_sim_time: true
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "wait"]
      spin:
        plugin: nav2_behaviors::Spin
      backup:
        plugin: nav2_behaviors::BackUp
      wait:
        plugin: nav2_behaviors::Wait
      local_frame: pinky1/odom
      global_frame: map
      robot_base_frame: pinky1/base_footprint
      transform_tolerance: 0.5
      simulate_ahead_time: 2.0
      max_rotational_vel: 0.6
      min_rotational_vel: 0.2
      rotational_acc_lim: 0.8
